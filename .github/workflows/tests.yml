name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install pytest-homeassistant-custom-component ruff
      - name: Lint
        run: ruff check custom_components tests --select E,F,W,I --ignore E501
      - name: Test
        run: pytest
